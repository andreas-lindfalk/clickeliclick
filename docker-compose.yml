services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123" # HTTP interface (curl, clickhouse-client via HTTP, browser at /play)
      - "9000:9000" # native TCP interface (used by the Go client)
    environment:
      CLICKHOUSE_DB: poc
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./migrations:/docker-entrypoint-initdb.d # runs *.sql on first start only

volumes:
  clickhouse-data:
